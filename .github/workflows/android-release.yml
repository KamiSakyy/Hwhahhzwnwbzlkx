name: Android release
on:
  workflow_dispatch:
  push:
    branches: ['arena/2e1290a9-hwhahhzwnwbzlkx']
    paths: ['app/**', '*.gradle', 'gradle.properties', 'settings.gradle', 'signing/**', '.github/workflows/android-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: |
          set -o pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 2>&1 | tee sdk.log || { tail -25 sdk.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Package arm64-only ABI marker
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" -shared -Os -Wl,-soname,libabi_marker.so -o app/src/main/jniLibs/arm64-v8a/libabi_marker.so app/src/main/native/abi_marker.c
      - name: Build and lint signed release
        run: |
          set -o pipefail
          gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease 2>&1 | tee build.log || { grep -A 10 -B 3 -E 'error:|What went wrong|Error:|FAILED|Exception' build.log | tail -70 | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Verify signature, size and ABI
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-report.txt
          SIZE=$(stat -c%s "$APK")
          test "$SIZE" -le 10000000
          unzip -Z1 "$APK" | grep '^lib/' > native-libs.txt
          grep -q '^lib/arm64-v8a/libabi_marker.so$' native-libs.txt
          ! grep -v '^lib/arm64-v8a/' native-libs.txt
          echo "APK bytes: $SIZE" | tee size-report.txt
          sha256sum "$APK" | tee SHA256SUMS
          { echo '## Signed release'; echo "Size: $SIZE bytes (limit 10,000,000)."; echo 'Java/XML with minimal arm64 ABI marker; only arm64-v8a packaged.'; echo 'Public development signing certificate; do not use for trusted production distribution.'; cat SHA256SUMS; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ThemeStudio-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            signing-report.txt
            size-report.txt
            SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
