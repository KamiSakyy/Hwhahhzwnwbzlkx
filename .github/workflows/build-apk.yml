name: Build APK

on:
  push:
    branches:
      - main
      - arena/**
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка LS Studio
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Нативный тест кодека (AES-256 + LZMA)
        run: |
          set -euo pipefail
          mkdir -p build-native
          g++ -std=c++17 -O2 -o build-native/codec_test \
            tools/codec_test.cpp \
            engine/src/main/cpp/codec.cpp \
            engine/src/main/cpp/aes.c \
            engine/src/main/cpp/lzma/LzmaEnc.c \
            engine/src/main/cpp/lzma/LzmaDec.c \
            engine/src/main/cpp/lzma/LzFind.c \
            engine/src/main/cpp/lzma/LzFindMt.c \
            engine/src/main/cpp/lzma/Alloc.c \
            engine/src/main/cpp/lzma/CpuArch.c \
            engine/src/main/cpp/lzma/Bra86.c \
            engine/src/main/cpp/lzma/Threads.c \
            -Iengine/src/main/cpp -Iengine/src/main/cpp/lzma -lpthread
          ./build-native/codec_test

      - name: Модульные тесты движка
        run: |
          set -o pipefail
          ./gradlew --no-daemon :engine:testDebugUnitTest 2>&1 | tee gradle-tests.log

      - name: Сборка runtime и studio
        run: |
          set -o pipefail
          ./gradlew --no-daemon :runtime:assembleRelease :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Проверка подписи APK (apksigner)
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk | tee apksigner-report.txt

      - name: Проверка размера APK (< 10 МБ)
        run: |
          set -euo pipefail
          size=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "Размер APK: $size байт"
          if [ "$size" -gt 10485760 ]; then
            echo "APK больше 10 МБ"
            exit 1
          fi

      - name: Проверка содержимого APK
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/release/app-release.apk | tee apk-contents.txt
          unzip -l runtime/build/outputs/apk/release/runtime-release-unsigned.apk | tee runtime-contents.txt

      - name: Архив исходников
        run: |
          set -euo pipefail
          mkdir -p handoff
          git archive --format=zip --prefix=LS-Engine-source/ -o handoff/LS-Engine-source.zip HEAD
          cp app/build/outputs/apk/release/app-release.apk handoff/LS-Studio.apk
          cp runtime/build/outputs/apk/release/runtime-release-unsigned.apk handoff/LS-Runtime-unsigned.apk
          ls -la handoff

      - name: Загрузка отчётов и логов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            gradle-tests.log
            gradle-build.log
            apk-contents.txt
            runtime-contents.txt
            apksigner-report.txt
            engine/build/reports/tests/
            engine/build/test-results/
          if-no-files-found: ignore

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: ls-engine-apk
          path: |
            handoff/*
            app/build/outputs/apk/release/app-release.apk
            apksigner-report.txt
            apk-contents.txt
          if-no-files-found: error
