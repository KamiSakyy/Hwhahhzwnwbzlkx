name: Build Nova Wallet APK
on:
  workflow_dispatch:
  push:
    branches: ["**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Install SDK
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:/usr/local/lib/android/sdk/cmdline-tools/latest/bin"
          which sdkmanager || ls $ANDROID_HOME
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
      - name: APK size (limit 50 MB)
        run: ls -lh app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with: { name: NovaWallet-APK, path: app/build/outputs/apk/release/*.apk }
