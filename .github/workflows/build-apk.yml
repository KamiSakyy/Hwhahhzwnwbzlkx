name: Build Nova Wallet APK
on:
  workflow_dispatch:
  push:
    branches: ["**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Install SDK
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:/usr/local/lib/android/sdk/cmdline-tools/latest/bin"
          which sdkmanager || ls $ANDROID_HOME
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build Release APK
        run: |
          set +e
          gradle assembleRelease --stacktrace > build.log 2>&1
          code=$?
          tail -n 60 build.log
          grep -E "error:|e: file|FAILURE|What went wrong|Execution failed|Caused by" build.log | head -n 40 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | while IFS= read -r l; do echo "::error::$l"; done
          grep -A3 "What went wrong" build.log | head -n 20 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build.log }
      - name: APK size (limit 50 MB)
        run: ls -lh app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with: { name: NovaWallet-APK, path: app/build/outputs/apk/release/*.apk }
      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "Nova Wallet v1.5.0"
          body: "Полноценный мультичейн криптокошелёк. Скачайте app-release.apk ниже и установите на Android (разрешите установку из браузера/файлов). Sepolia — бесплатно создать свой токен."
          files: app/build/outputs/apk/release/*.apk
