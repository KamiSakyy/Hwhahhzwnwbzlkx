plugins { id 'com.android.application' }
android {
 namespace 'dev.forge.builder'; compileSdk 36
 defaultConfig { applicationId 'dev.forge.builder'; minSdk 28; targetSdk 36; versionCode 1; versionName '0.1' }
 buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.android.material:material:1.13.0'; implementation 'com.android.tools.build:apksig:8.10.1' }
