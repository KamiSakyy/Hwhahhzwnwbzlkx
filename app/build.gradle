plugins { id 'com.android.application' }
android {
    namespace 'com.novawallet.app'
    compileSdk 34
    defaultConfig { applicationId "com.novawallet.app"; minSdk 26; targetSdk 34; versionCode 5; versionName "1.3.0" }
    signingConfigs {
        release { storeFile file('../keystore/nova-release.p12'); storePassword 'nova2026'; keyAlias 'nova'; keyPassword 'nova2026'; storeType 'PKCS12' }
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { pickFirsts += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF','META-INF/versions/**','META-INF/DISCLAIMER','META-INF/LICENSE*','META-INF/NOTICE*','META-INF/DEPENDENCIES','META-INF/*.kotlin_module']; excludes += ['META-INF/*.SF','META-INF/*.DSA','META-INF/*.RSA'] } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'org.web3j:core:4.12.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
