plugins { id 'com.android.application' }
android {
 namespace 'dev.themestudio'
 compileSdk 35
 defaultConfig {
  applicationId 'dev.themestudio'; minSdk 26; targetSdk 35
  versionCode 1; versionName '0.1.0'
  ndk { abiFilters 'arm64-v8a' }
 }
 signingConfigs { release { storeFile rootProject.file('signing/release.p12'); storePassword 'themestudio-public'; keyAlias 'themestudio'; keyPassword 'themestudio-public'; storeType 'PKCS12' } }
 buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
