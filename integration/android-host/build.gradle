// Experimental editor host using REAL Telegram components. APK explicitly requested by user.
apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

android {
    namespace 'dev.themestudio.host'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.themestudio.editor'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.2.0-experimental'
        multiDexEnabled true
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            storeFile new File(System.getenv('THEME_STUDIO_ROOT'), 'signing/release.p12')
            storePassword 'themestudio-public'
            keyAlias 'themestudio'
            keyPassword 'themestudio-public'
            storeType 'PKCS12'
        }
    }
    buildTypes {
        debug { matchingFallbacks = ['debug'] }
        release {
            matchingFallbacks = ['release']
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
